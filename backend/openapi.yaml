openapi: 3.0.3
info:
  title: Placement Management API
  description: >
    API for a campus placement management system supporting three roles:
    admin, company, and student. Handles authentication, drive (job posting)
    management, applications, interviews, placements, and async data exports.
  version: "1.0.0"
servers:
  - url: /api
    description: Base API path

tags:
  - name: Auth
    description: Registration, login, and account management
  - name: Admin
    description: Admin dashboard, approvals, and moderation
  - name: Company
    description: Company dashboard, drives, applications, and placements
  - name: Student
    description: Student dashboard, drives, applications, and placements

security:
  - bearerAuth: []

paths:
  # ---------------------------------------------------------------- AUTH ---
  /auth/login:
    post:
      tags: [Auth]
      summary: Log in with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    type: object
                    properties:
                      email:
                        type: string
                      role:
                        $ref: "#/components/schemas/UserRole"
        "400":
          description: Missing email or password
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Wrong email or password
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Account has been deactivated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: User does not exist
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/register/student:
    post:
      tags: [Auth]
      summary: Register a new student account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, repeat_password, name, roll_no]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
                repeat_password: { type: string, format: password }
                name: { type: string }
                roll_no: { type: string }
      responses:
        "201":
          description: Student account created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessMessage" }
        "400":
          description: Validation error (missing fields, weak password, mismatched passwords)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: User or roll number already exists
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Registration failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorDetails" }

  /auth/register/company:
    post:
      tags: [Auth]
      summary: Register a new company account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, repeat_password, name]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
                repeat_password: { type: string, format: password }
                name: { type: string }
      responses:
        "201":
          description: Company account created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessMessage" }
        "400":
          description: Validation error (missing fields, weak password, mismatched passwords)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: User or company name already exists
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Registration failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorDetails" }

  /auth/me:
    get:
      tags: [Auth]
      summary: Get the current authenticated user's profile
      responses:
        "200":
          description: Current user profile (fields vary by role)
          content:
            application/json:
              schema:
                type: object
                properties:
                  email: { type: string }
                  role: { $ref: "#/components/schemas/UserRole" }
                  name: { type: string }
                  roll_no: { type: string }
                  department: { type: string, nullable: true }
                  approval_status: { $ref: "#/components/schemas/CompanyStatus" }

  /auth/change-password:
    put:
      tags: [Auth]
      summary: Change the current user's password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password, repeat_password]
              properties:
                current_password: { type: string, format: password }
                new_password: { type: string, format: password }
                repeat_password: { type: string, format: password }
      responses:
        "200":
          description: Password updated successfully
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessMessage" }
        "400":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Current password is incorrect
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: User not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # --------------------------------------------------------------- ADMIN ---
  /admin/dashboard:
    get:
      tags: [Admin]
      summary: Get admin dashboard statistics and analytics
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminDashboard" }

  /admin/companies:
    get:
      tags: [Admin]
      summary: List all companies (with optional search)
      parameters:
        - $ref: "#/components/parameters/Search"
      responses:
        "200":
          description: List of companies
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Company" }

  /admin/companies/{id}/approve:
    put:
      tags: [Admin]
      summary: Approve a company
      parameters:
        - $ref: "#/components/parameters/CompanyId"
      responses:
        "200":
          description: Company approved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessMessage" }
        "404":
          description: Company not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Failed to update company
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorDetails" }

  /admin/companies/{id}/reject:
    put:
      tags: [Admin]
      summary: Reject a company
      parameters:
        - $ref: "#/components/parameters/CompanyId"
      responses:
        "200":
          description: Company rejected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessMessage" }
        "404":
          description: Company not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Failed to update company
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorDetails" }

  /admin/companies/{id}/blacklist:
    put:
      tags: [Admin]
      summary: Blacklist (deactivate) a company's user account
      parameters:
        - $ref: "#/components/parameters/CompanyId"
      responses:
        "200":
          description: Company blacklisted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessMessage" }
        "404":
          description: Company not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Failed to update company
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorDetails" }

  /admin/students:
    get:
      tags: [Admin]
      summary: List all students (with optional search)
      parameters:
        - $ref: "#/components/parameters/Search"
      responses:
        "200":
          description: List of students
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Student" }

  /admin/students/{id}/blacklist:
    put:
      tags: [Admin]
      summary: Blacklist (deactivate) a student's user account
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: Student ID
      responses:
        "200":
          description: Student blacklisted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessMessage" }
        "404":
          description: Student not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Failed to update student
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorDetails" }

  /admin/drives:
    get:
      tags: [Admin]
      summary: List all drives
      responses:
        "200":
          description: List of drives
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Drive" }

  /admin/drives/{id}/approve:
    put:
      tags: [Admin]
      summary: Approve a drive
      parameters:
        - $ref: "#/components/parameters/DriveId"
      responses:
        "200":
          description: Drive approved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessMessage" }
        "404":
          description: Drive not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Failed to update drive
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorDetails" }

  /admin/drives/{id}/reject:
    put:
      tags: [Admin]
      summary: Reject a drive
      parameters:
        - $ref: "#/components/parameters/DriveId"
      responses:
        "200":
          description: Drive rejected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessMessage" }
        "404":
          description: Drive not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Failed to update drive
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorDetails" }

  /admin/drives/{id}/close:
    put:
      tags: [Admin]
      summary: Close a drive
      parameters:
        - $ref: "#/components/parameters/DriveId"
      responses:
        "200":
          description: Drive closed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessMessage" }
        "404":
          description: Drive not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Failed to update drive
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorDetails" }

  /admin/applications:
    get:
      tags: [Admin]
      summary: List all applications across all drives
      responses:
        "200":
          description: List of applications
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    application_id: { type: string }
                    student_name: { type: string }
                    roll_no: { type: string }
                    company: { type: string }
                    job_title: { type: string }
                    status: { $ref: "#/components/schemas/ApplicationStatus" }
                    application_date: { type: string, format: date-time }

  # ------------------------------------------------------------- COMPANY ---
  /company/dashboard:
    get:
      tags: [Company]
      summary: Get the authenticated company's dashboard
      responses:
        "200":
          description: Company dashboard data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanyDashboard" }
        "404":
          description: Company not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /company/profile:
    get:
      tags: [Company]
      summary: Get the authenticated company's profile
      responses:
        "200":
          description: Company profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Company" }
        "404":
          description: Company not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    put:
      tags: [Company]
      summary: Update the authenticated company's profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                contact: { type: string }
                website: { type: string }
                industry: { type: string }
                description: { type: string }
                location: { type: string }
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  company: { $ref: "#/components/schemas/Company" }
        "400":
          description: Invalid field or missing body
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Company not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Failed to update profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorDetails" }

  /company/drives:
    get:
      tags: [Company]
      summary: List the authenticated company's drives
      responses:
        "200":
          description: List of drives
          content:
            application/json:
              schema:
                type: object
                properties:
                  drives:
                    type: array
                    items: { $ref: "#/components/schemas/Drive" }
        "404":
          description: Company not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      tags: [Company]
      summary: Create a new drive (job posting)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DriveInput" }
      responses:
        "201":
          description: Drive created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  drive_id: { type: string }
        "400":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Company not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Failed to create drive
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorDetails" }

  /company/drives/{id}:
    get:
      tags: [Company]
      summary: Get a drive owned by the authenticated company
      parameters:
        - $ref: "#/components/parameters/DriveId"
      responses:
        "200":
          description: Drive details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Drive" }
        "404":
          description: Company or drive not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    put:
      tags: [Company]
      summary: Update a drive owned by the authenticated company
      parameters:
        - $ref: "#/components/parameters/DriveId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DriveInput" }
      responses:
        "200":
          description: Drive updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  drive: { $ref: "#/components/schemas/Drive" }
        "400":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Company or drive not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Approved or closed drives cannot be modified
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Update failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /company/drives/{id}/applications:
    get:
      tags: [Company]
      summary: List applications for a specific drive
      parameters:
        - $ref: "#/components/parameters/DriveId"
      responses:
        "200":
          description: Drive applications
          content:
            application/json:
              schema:
                type: object
                properties:
                  drive_id: { type: string }
                  job_title: { type: string }
                  required_skills: { type: string, nullable: true }
                  experience_required: { type: string, nullable: true }
                  benefits: { type: string, nullable: true }
                  applications:
                    type: array
                    items: { $ref: "#/components/schemas/ApplicationDetail" }
        "404":
          description: Company or drive not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /company/drives/{id}/applications/{app_id}:
    put:
      tags: [Company]
      summary: Update an application's status (shortlist, select, reject)
      parameters:
        - $ref: "#/components/parameters/DriveId"
        - name: app_id
          in: path
          required: true
          schema: { type: string }
          description: Application ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { $ref: "#/components/schemas/ApplicationStatus" }
                remarks: { type: string, nullable: true }
                interview_date:
                  type: string
                  format: date-time
                  description: Required when status is "shortlisted"
                interview_type:
                  $ref: "#/components/schemas/InterviewType"
      responses:
        "200":
          description: Application updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  application:
                    type: object
                    properties:
                      application_id: { type: string }
                      status: { $ref: "#/components/schemas/ApplicationStatus" }
                      remarks: { type: string, nullable: true }
        "400":
          description: Invalid status or missing interview details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Company, drive, or application not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /company/drives/{id}/close:
    put:
      tags: [Company]
      summary: Close the authenticated company's drive
      parameters:
        - $ref: "#/components/parameters/DriveId"
      responses:
        "200":
          description: Drive closed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  drive_id: { type: string }
                  status: { $ref: "#/components/schemas/DriveStatus" }
        "404":
          description: Company or drive not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Drive is already closed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Failed to close drive
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorDetails" }

  /company/applications/{app_id}/resume:
    get:
      tags: [Company]
      summary: Download an applicant's resume (PDF)
      parameters:
        - name: app_id
          in: path
          required: true
          schema: { type: string }
          description: Application ID
      responses:
        "200":
          description: Resume PDF file
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "404":
          description: Company, application, or resume not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /company/interviews:
    get:
      tags: [Company]
      summary: List all scheduled interviews for the authenticated company
      responses:
        "200":
          description: List of interviews
          content:
            application/json:
              schema:
                type: object
                properties:
                  interviews:
                    type: array
                    items:
                      type: object
                      properties:
                        application_id: { type: string }
                        drive_id: { type: string }
                        job_title: { type: string }
                        student_name: { type: string }
                        roll_no: { type: string }
                        status: { $ref: "#/components/schemas/ApplicationStatus" }
                        interview_date: { type: string, format: date-time }
                        interview_type: { $ref: "#/components/schemas/InterviewType" }
                        is_upcoming: { type: boolean }
        "404":
          description: Company not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /company/placements:
    get:
      tags: [Company]
      summary: List placements resulting from the authenticated company's drives
      responses:
        "200":
          description: List of placements
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
                  placements:
                    type: array
                    items: { $ref: "#/components/schemas/CompanyPlacement" }
        "404":
          description: Company not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /company/placements/{placement_id}:
    put:
      tags: [Company]
      summary: Update a placement's salary and joining date
      parameters:
        - $ref: "#/components/parameters/PlacementId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [salary, joining_date]
              properties:
                salary: { type: integer, minimum: 1 }
                joining_date: { type: string, format: date-time }
      responses:
        "200":
          description: Placement updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  placement: { $ref: "#/components/schemas/CompanyPlacement" }
        "400":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Company or placement not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Failed to update placement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorDetails" }

  /company/placements/{placement_id}/offer-letter:
    post:
      tags: [Company]
      summary: Upload an offer letter (PDF) for a placement
      parameters:
        - $ref: "#/components/parameters/PlacementId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [offer_letter]
              properties:
                offer_letter:
                  type: string
                  format: binary
      responses:
        "200":
          description: Offer letter uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  placement_id: { type: string }
                  offer_letter_path: { type: string }
        "400":
          description: Missing file or invalid file type (PDF only)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Company or placement not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Failed to upload offer letter
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorDetails" }

  /company/exports:
    post:
      tags: [Company]
      summary: Trigger an asynchronous export of the company's history
      responses:
        "202":
          description: Export job started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExportTaskStarted" }
        "403":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Company profile not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /company/exports/status/{task_id}:
    get:
      tags: [Company]
      summary: Get the status of an export job
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Task status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExportTaskStatus" }

  /company/exports/download/{filename}:
    get:
      tags: [Company]
      summary: Download a completed export file
      parameters:
        - $ref: "#/components/parameters/ExportFilename"
      responses:
        "200":
          description: Export file
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "400":
          description: Invalid file path
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: File not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ------------------------------------------------------------- STUDENT ---
  /student/dashboard:
    get:
      tags: [Student]
      summary: Get the authenticated student's dashboard
      responses:
        "200":
          description: Student dashboard data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudentDashboard" }
        "400":
          description: Incomplete profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Student not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /student/profile:
    get:
      tags: [Student]
      summary: Get the authenticated student's profile
      responses:
        "200":
          description: Student profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Student" }
        "404":
          description: Student not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    put:
      tags: [Student]
      summary: Update the authenticated student's profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                department: { type: string }
                cgpa: { type: number, minimum: 0, maximum: 10 }
                year: { type: integer, enum: [1, 2, 3, 4] }
                phone_number: { type: string }
                skills: { type: string }
                experience: { type: string }
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  student: { $ref: "#/components/schemas/Student" }
        "400":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Student not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Failed to update profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorDetails" }

  /student/profile/resume:
    get:
      tags: [Student]
      summary: Download the authenticated student's resume (PDF)
      responses:
        "200":
          description: Resume PDF file
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "404":
          description: Student or resume not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      tags: [Student]
      summary: Upload the authenticated student's resume (PDF)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [resume]
              properties:
                resume:
                  type: string
                  format: binary
      responses:
        "200":
          description: Resume uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  resume_path: { type: string }
                  resume_uploaded: { type: boolean }
                  resume_filename: { type: string }
        "400":
          description: Missing file or invalid file type (PDF only)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Student not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Failed to upload file
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorDetails" }

  /student/drives:
    get:
      tags: [Student]
      summary: List drives the authenticated student is eligible for
      parameters:
        - $ref: "#/components/parameters/Search"
      responses:
        "200":
          description: Eligible drives
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
                  drives:
                    type: array
                    items: { $ref: "#/components/schemas/Drive" }
        "400":
          description: Incomplete profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Student not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /student/drives/{id}:
    get:
      tags: [Student]
      summary: Get details of an approved drive
      parameters:
        - $ref: "#/components/parameters/DriveId"
      responses:
        "200":
          description: Drive details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Drive" }
        "404":
          description: Drive not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /student/drives/{id}/apply:
    post:
      tags: [Student]
      summary: Apply to a drive
      parameters:
        - $ref: "#/components/parameters/DriveId"
      responses:
        "201":
          description: Application submitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  application_id: { type: string }
        "400":
          description: Incomplete profile, missing resume, or deadline passed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Not eligible for this drive
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Drive or student not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Already applied to this drive
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Failed to submit application
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorDetails" }

  /student/applications:
    get:
      tags: [Student]
      summary: List the authenticated student's applications
      responses:
        "200":
          description: List of applications
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
                  applications:
                    type: array
                    items: { $ref: "#/components/schemas/Application" }
        "404":
          description: Student not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /student/placements:
    get:
      tags: [Student]
      summary: List the authenticated student's placements
      responses:
        "200":
          description: List of placements
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
                  placements:
                    type: array
                    items: { $ref: "#/components/schemas/StudentPlacement" }
        "404":
          description: Student not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /student/placements/{placement_id}:
    get:
      tags: [Student]
      summary: Get details of a specific placement
      parameters:
        - $ref: "#/components/parameters/PlacementId"
      responses:
        "200":
          description: Placement details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudentPlacement" }
        "404":
          description: Student or placement not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /student/placements/{placement_id}/offer-letter:
    get:
      tags: [Student]
      summary: Download the offer letter (PDF) for a placement
      parameters:
        - $ref: "#/components/parameters/PlacementId"
      responses:
        "200":
          description: Offer letter PDF file
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "404":
          description: Student, placement, or offer letter not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /student/exports:
    post:
      tags: [Student]
      summary: Trigger an asynchronous export of the student's history
      responses:
        "202":
          description: Export job started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExportTaskStarted" }
        "403":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Student profile not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /student/exports/status/{task_id}:
    get:
      tags: [Student]
      summary: Get the status of an export job
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Task status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExportTaskStatus" }

  /student/exports/download/{filename}:
    get:
      tags: [Student]
      summary: Download a completed export file
      parameters:
        - $ref: "#/components/parameters/ExportFilename"
      responses:
        "200":
          description: Export file
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "400":
          description: Invalid file path
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: File not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token obtained from /auth/login

  parameters:
    Search:
      name: search
      in: query
      required: false
      schema: { type: string }
      description: Free-text search filter
    CompanyId:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: Company ID
    DriveId:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: Drive ID
    PlacementId:
      name: placement_id
      in: path
      required: true
      schema: { type: string }
      description: Placement ID
    TaskId:
      name: task_id
      in: path
      required: true
      schema: { type: string }
      description: Async export job/task ID
    ExportFilename:
      name: filename
      in: path
      required: true
      schema: { type: string }
      description: Export file name

  schemas:
    UserRole:
      type: string
      enum: [admin, student, company]
    CompanyStatus:
      type: string
      enum: [approved, not_approved]
    DriveStatus:
      type: string
      enum: [pending, approved, closed, rejected]
    ApplicationStatus:
      type: string
      enum: [applied, shortlisted, selected, rejected]
    InterviewType:
      type: string
      enum: [online, inPerson]

    Error:
      type: object
      properties:
        error:
          type: string
    ErrorDetails:
      type: object
      properties:
        error:
          type: string
        details:
          type: string
    SuccessMessage:
      type: object
      properties:
        success:
          type: string

    Company:
      type: object
      properties:
        company_id: { type: string }
        user_id: { type: string }
        name: { type: string }
        contact: { type: string, nullable: true }
        website: { type: string, nullable: true }
        approval_status: { $ref: "#/components/schemas/CompanyStatus" }
        industry: { type: string, nullable: true }
        description: { type: string, nullable: true }
        location: { type: string, nullable: true }
        created_at: { type: string, format: date-time, nullable: true }
        is_active: { type: boolean }
        drives: { type: integer }

    Student:
      type: object
      properties:
        student_id: { type: string }
        user_id: { type: string }
        name: { type: string }
        roll_no: { type: string }
        phone_number: { type: string, nullable: true }
        department: { type: string, nullable: true }
        cgpa: { type: number, nullable: true }
        year: { type: integer, nullable: true }
        skills: { type: string, nullable: true }
        experience: { type: string, nullable: true }
        resume_path: { type: string, nullable: true }
        resume_uploaded: { type: boolean }
        resume_filename: { type: string, nullable: true }
        created_at: { type: string, format: date-time, nullable: true }
        is_active: { type: boolean }

    Drive:
      type: object
      properties:
        drive_id: { type: string }
        company_id: { type: string }
        company_name: { type: string, nullable: true }
        job_title: { type: string }
        job_description: { type: string, nullable: true }
        job_location: { type: string, nullable: true }
        application_deadline: { type: string, format: date-time }
        eligible_branch: { type: string, nullable: true }
        min_cgpa: { type: number, nullable: true }
        year: { type: integer, nullable: true }
        no_openings: { type: integer, nullable: true }
        salary: { type: integer, nullable: true }
        required_skills: { type: string, nullable: true }
        experience_required: { type: string, nullable: true }
        benefits: { type: string, nullable: true }
        approval_status: { $ref: "#/components/schemas/DriveStatus" }
        applicants: { type: integer }
        created_at: { type: string, format: date-time, nullable: true }

    DriveInput:
      type: object
      required: [job_title, application_deadline]
      properties:
        job_title: { type: string }
        job_location: { type: string }
        job_description: { type: string }
        application_deadline: { type: string, format: date-time }
        eligible_branch: { type: string }
        min_cgpa: { type: number, minimum: 0, maximum: 10 }
        year: { type: integer }
        no_openings: { type: integer, minimum: 1 }
        salary: { type: integer }
        required_skills: { type: string, maxLength: 2000 }
        experience_required: { type: string, maxLength: 2000 }
        benefits: { type: string, maxLength: 2000 }

    Application:
      type: object
      properties:
        application_id: { type: string }
        student_id: { type: string }
        drive_id: { type: string }
        application_date: { type: string, format: date-time }
        status: { $ref: "#/components/schemas/ApplicationStatus" }
        remarks: { type: string, nullable: true }
        interview_date: { type: string, format: date-time, nullable: true }
        interview_type: { $ref: "#/components/schemas/InterviewType" }
        drive: { $ref: "#/components/schemas/Drive" }
        created_at: { type: string, format: date-time, nullable: true }

    ApplicationDetail:
      type: object
      properties:
        application_id: { type: string }
        student_id: { type: string }
        student_name: { type: string }
        roll_no: { type: string }
        department: { type: string, nullable: true }
        cgpa: { type: number, nullable: true }
        resume_uploaded: { type: boolean }
        job_title: { type: string }
        status: { $ref: "#/components/schemas/ApplicationStatus" }
        remarks: { type: string, nullable: true }
        application_date: { type: string, format: date-time }
        interview_date: { type: string, format: date-time, nullable: true }
        interview_type: { $ref: "#/components/schemas/InterviewType" }

    CompanyPlacement:
      type: object
      properties:
        placement_id: { type: string }
        drive_id: { type: string }
        student_name: { type: string }
        roll_no: { type: string }
        job_title: { type: string }
        salary: { type: integer, nullable: true }
        joining_date: { type: string, format: date-time, nullable: true }
        offer_letter_uploaded: { type: boolean }
        created_at: { type: string, format: date-time, nullable: true }

    StudentPlacement:
      type: object
      properties:
        placement_id: { type: string }
        company: { type: string }
        job_title: { type: string }
        salary: { type: integer, nullable: true }
        joining_date: { type: string, format: date-time, nullable: true }
        offer_letter_available: { type: boolean }
        created_at: { type: string, format: date-time, nullable: true }

    ExportTaskStarted:
      type: object
      properties:
        message: { type: string }
        task_id: { type: string }

    ExportTaskStatus:
      type: object
      properties:
        task_id: { type: string }
        state:
          type: string
          description: Celery task state (e.g. PENDING, STARTED, SUCCESS, FAILURE)
        result:
          nullable: true
          description: Task result payload, present only when the task has completed

    AdminDashboard:
      type: object
      properties:
        stats:
          type: object
          properties:
            students: { type: integer }
            companies: { type: integer }
            drives: { type: integer }
            applications: { type: integer }
            pending_companies: { type: integer }
            pending_drives: { type: integer }
            blacklisted: { type: integer }
        pending:
          type: array
          items:
            type: object
            properties:
              title: { type: string }
              subtitle: { type: string }
              link: { type: string }
        recent_activity:
          type: array
          items:
            type: object
            properties:
              message: { type: string }
              time: { type: string, format: date-time }
        recent_drives:
          type: array
          items:
            type: object
            properties:
              drive_id: { type: string }
              company_name: { type: string }
              job_location: { type: string, nullable: true }
              job_title: { type: string }
              application_deadline: { type: string }
              applicants: { type: integer }
              approval_status: { $ref: "#/components/schemas/DriveStatus" }
        analytics:
          type: object
          properties:
            monthly:
              type: array
              items:
                type: object
                properties:
                  label: { type: string }
                  placements: { type: integer }
                  applications: { type: integer }
            skill_demand:
              type: array
              items:
                type: object
                properties:
                  skill: { type: string }
                  count: { type: integer }
            application_funnel:
              type: object
              properties:
                applied: { type: integer }
                shortlisted: { type: integer }
                selected: { type: integer }
                rejected: { type: integer }

    CompanyDashboard:
      type: object
      properties:
        company: { $ref: "#/components/schemas/Company" }
        stats:
          type: object
          properties:
            active_drives: { type: integer }
            total_applications: { type: integer }
            interviews_scheduled: { type: integer }
            offers_made: { type: integer }
        trends:
          type: object
          properties:
            active_drives_new_7d: { type: integer }
            total_applications_new_7d: { type: integer }
        active_drives:
          type: array
          items:
            type: object
            properties:
              drive_id: { type: string }
              job_title: { type: string }
              job_location: { type: string, nullable: true }
              company_name: { type: string }
              applicants_count: { type: integer }
              status:
                type: string
                enum: [active, shortlisting, interviewing]
              application_deadline: { type: string }
        recent_applicants:
          type: array
          items:
            type: object
            properties:
              application_id: { type: string }
              drive_id: { type: string }
              student_name: { type: string }
              roll_no: { type: string }
              job_title: { type: string }
              status: { $ref: "#/components/schemas/ApplicationStatus" }
              application_date: { type: string }

    StudentDashboard:
      type: object
      properties:
        counts:
          type: object
          properties:
            eligible: { type: integer }
            applied: { type: integer }
            shortlisted: { type: integer }
            selected: { type: integer }
        eligible_drives:
          type: array
          items: { $ref: "#/components/schemas/Drive" }
        applied_drives:
          type: array
          items:
            type: object
            properties:
              application_id: { type: string }
              application_date: { type: string }
              status: { type: string, enum: [applied] }
              drive: { $ref: "#/components/schemas/Drive" }
        shortlisted_drives:
          type: array
          items:
            type: object
            properties:
              application_id: { type: string }
              status: { type: string, enum: [shortlisted] }
              remarks: { type: string, nullable: true }
              interview_date: { type: string, nullable: true }
              interview_type: { $ref: "#/components/schemas/InterviewType" }
              drive: { $ref: "#/components/schemas/Drive" }
        selected_drives:
          type: array
          items:
            type: object
            properties:
              application_id: { type: string }
              status: { type: string, enum: [selected] }
              remarks: { type: string, nullable: true }
              interview_date: { type: string, nullable: true }
              interview_type: { $ref: "#/components/schemas/InterviewType" }
              drive: { $ref: "#/components/schemas/Drive" }
        upcoming_interviews:
          type: array
          items:
            type: object
            properties:
              application_id: { type: string }
              company: { type: string }
              job_title: { type: string }
              interview_date: { type: string }
              interview_type: { $ref: "#/components/schemas/InterviewType" }
